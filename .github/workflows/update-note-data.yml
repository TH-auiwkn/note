name: Update note data

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update article data
        run: python3 scripts/update-pharma-note-viewer.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/pharma_note_articles.json; then
            echo "No article data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pharma_note_articles.json
          git commit -m "Update note article data"
          git push
